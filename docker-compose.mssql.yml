version: '3.8'
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - '1433:1433'
    volumes:
      - mssql-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DatabaseProvider=SqlServer
      - ConnectionStrings__SqlServer=Server=mssql,1433;Database=MiniERP;User Id=sa;Password=Your_password123;
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - mssql
    ports:
      - '5000:5000'

  web:
    build:
      context: .
      dockerfile: src/MiniERP.Web/Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  mssql-data:
